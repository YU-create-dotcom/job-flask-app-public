<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活管理表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
.mail-card {
    max-height: 50vh;
    overflow: hidden;
}

.mail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.small-button {
    font-size: 14px;
    padding: 6px 12px;
    cursor: pointer;
}

.mail-scroll-area {
    max-height: 38vh;
    overflow-y: auto;
    padding-right: 8px;
}

.mail-item {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.mail-item p {
    margin: 4px 0;
}

.mail-summary {
    color: #333;
    line-height: 1.5;
}
.dashboard .card {
    max-height: 50vh;
    overflow: hidden;
}

#weeklyEvents,
#deadlineEvents,
#companyList {
    max-height: 38vh;
    overflow-y: auto;
    padding-right: 8px;
}

#weeklyEvents p,
#deadlineEvents p,
#companyList p {
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
    margin: 0;
}
</style>
</head>
<body>

<header>
    <h1>就活管理ダッシュボード</h1>
    <div class="nav-buttons">
  <a href="/gd/new" class="nav-button">GD・面接ログを追加</a>
  <a href="/gd/logs" class="nav-button secondary">GD・面接ログ一覧</a>
  <a href="/self-profile" class="nav-button">自己分析管理</a>
</div>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <h2>今日・今週の予定</h2>
            <div id="weeklyEvents"></div>
        </div>

        <div class="card">
            <h2>締切が近いES・適性検査</h2>
            <div id="deadlineEvents"></div>
        </div>

        <div class="card mail-card">
            <div class="mail-header">
                <h2>受信メール一覧</h2>
                <button id="showMailDetails" class="small-button">詳細を表示</button>
            </div>

            <div id="unhandledMails" class="mail-scroll-area">
                <p>読み込み中...</p>
            </div>
        </div>

        <div class="card">
            <h2>選考中企業一覧</h2>
            <div id="companyList"></div>
        </div>
    </section>

    <section class="calendar-section">
        <div class="calendar-header">
            <button id="prevMonth">＜</button>
            <h2 id="monthTitle"></h2>
            <button id="nextMonth">＞</button>
        </div>

        <div class="calendar-weekdays">
            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>
        </div>

        <div id="calendar" class="calendar"></div>
    </section>
</main>

<div id="modal" class="modal">
    <div class="modal-content">
        <button id="closeModal">×</button>
        <h2 id="modalTitle"></h2>
        <p id="modalDate"></p>
        <p id="modalSummary"></p>
    </div>
</div>

<script>
let events = [];
let currentDate = new Date();

fetch("/api/events")
    .then(response => response.json())
    .then(data => {
        events = data;
        renderCalendar();
        renderDashboard();
    });

function renderCalendar() {
    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

   monthTitle.textContent = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1);
    const startDay = firstDay.getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const totalCells = Math.ceil((startDay + lastDate) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement("div");
        cell.className = "calendar-cell";

        const dateNum = i - startDay + 1;

        if (dateNum > 0 && dateNum <= lastDate) {
            const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(dateNum).padStart(2, "0")}`;

            const dateLabel = document.createElement("div");
            dateLabel.className = "date-label";
            dateLabel.textContent = dateNum;
            cell.appendChild(dateLabel);

            const dayEvents = events.filter(e => e.date === dateStr);

            if (dayEvents.some(e => e.incomplete)) {
                cell.classList.add("incomplete-day");
            }

            dayEvents.forEach(event => {
                const eventDiv = document.createElement("div");
                eventDiv.className = "event";
                eventDiv.textContent = `${event.time} ${event.company}`;
                eventDiv.onclick = () => openModal(event);
                cell.appendChild(eventDiv);
            });
        } else {
            cell.classList.add("empty");
        }

        calendar.appendChild(cell);
    }
}

function escapeHtml(text) {
    return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

fetch("/api/mails")
    .then(response => response.json())
    .then(mails => {
        const area = document.getElementById("unhandledMails");

        if (!mails || mails.length === 0) {
            area.innerHTML = "<p>受信メールなし</p>";
            return;
        }

        area.innerHTML = mails.map(mail => `
            <div class="mail-item">
                <p><strong>${escapeHtml(mail.received_at)}</strong>　${escapeHtml(mail.company || "企業名不明")}</p>
                <p class="mail-summary">${escapeHtml(mail.snippet || mail.subject)}</p>
            </div>
        `).join("");
    })
    .catch(error => {
        document.getElementById("unhandledMails").innerHTML =
            "<p>メールの読み込みに失敗しました。</p>";
        console.error(error);
    });

document.getElementById("showMailDetails").onclick = () => {
    window.open("/mail/details", "_blank");
};

function renderDashboard() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const oneWeekLater = new Date(today);
    oneWeekLater.setDate(today.getDate() + 7);

    const weekly = events.filter(e => {
        const d = new Date(e.date);
        d.setHours(0, 0, 0, 0);
        return d >= today && d <= oneWeekLater;
    });

    document.getElementById("weeklyEvents").innerHTML =
        weekly.map(e => `<p>${e.date} ${e.time} ${e.title}</p>`).join("") || "<p>予定なし</p>";

    const deadlines = events.filter(e => e.category === "ES締切");

    document.getElementById("deadlineEvents").innerHTML =
        deadlines.map(e => `<p>${e.date} ${e.time} ${e.company}</p>`).join("") || "<p>締切なし</p>";

    const companies = [...new Set(events.map(e => e.company))];

    document.getElementById("companyList").innerHTML =
        companies.map(c => `<p>${c}</p>`).join("") || "<p>企業なし</p>";
}

function openModal(event) {
    document.getElementById("modalTitle").textContent = event.title;
    document.getElementById("modalDate").textContent = `${event.date} ${event.time}`;
    document.getElementById("modalSummary").textContent = event.summary || "概要なし";
    document.getElementById("modal").style.display = "flex";
}

document.getElementById("closeModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

document.getElementById("prevMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
};

document.getElementById("nextMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
};
</script>

</body>
</html>
