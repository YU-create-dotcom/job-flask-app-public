<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>就活管理表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
.mail-card {
    max-height: 50vh;
    overflow: hidden;
}

.mail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.small-button {
    font-size: 14px;
    padding: 6px 12px;
    cursor: pointer;
}

.mail-scroll-area {
    max-height: 38vh;
    overflow-y: auto;
    padding-right: 8px;
}

.mail-item {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.mail-item p {
    margin: 4px 0;
}

.mail-summary {
    color: #333;
    line-height: 1.5;
}

header h1 {
    font-size: 40px;
    line-height: 1.2;
}

.nav-button {
    font-size: 18px;
}

.small-button {
    font-size: 14px;
}

.dashboard .card {
    max-height: 50vh;
    overflow: hidden;
}

.dashboard .card h2,
.mail-header h2 {
    font-size: 28px;
    line-height: 1.25;
    margin: 0 0 14px;
}

#weeklyEvents,
#deadlineEvents,
#companyList {
    max-height: 38vh;
    overflow-y: auto;
    padding-right: 8px;
}

.mail-scroll-area {
    max-height: 38vh;
}

#weeklyEvents p,
#deadlineEvents p,
#companyList p {
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
    margin: 0;
    font-size: 18px;
    line-height: 1.45;
}

.mail-item {
    font-size: 18px;
    line-height: 1.45;
}

@media (max-width: 700px) {
    body {
        font-size: 16px;
        overflow-x: hidden;
    }

    header {
        padding: 20px 12px 16px;
        overflow: hidden;
    }

    header h1 {
        max-width: calc(100% - 162px);
        font-size: 18px;
        line-height: 1.2;
    }

    main {
        padding: 12px 10px 20px;
        overflow-x: hidden;
    }

    .dashboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
        min-width: 0;
    }

    .dashboard .card {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        height: 220px;
        max-height: none;
        min-height: 0;
        min-width: 0;
        padding: 12px;
        overflow: hidden;
    }

    .dashboard .card h2,
    .mail-header h2 {
        font-size: 13.5px;
        line-height: 1.25;
        margin: 0 0 10px;
        overflow-wrap: anywhere;
        white-space: nowrap;
        min-width: 0;
    }

    .mail-header {
        align-items: center;
        gap: 4px;
        margin-bottom: 8px;
        flex-wrap: nowrap;
    }

    .small-button {
        flex: 0 0 auto;
        font-size: 8px;
        padding: 4px 5px;
        border-radius: 14px;
        white-space: nowrap;
    }

    #weeklyEvents,
    #deadlineEvents,
    #companyList,
    .mail-scroll-area {
        flex: 1;
        min-height: 0;
        max-height: none;
        overflow-y: auto;
        padding-right: 6px;
    }

    #weeklyEvents p,
    #deadlineEvents p,
    #companyList p,
    .mail-item {
        font-size: 12.5px;
        line-height: 1.45;
        padding: 7px 0;
    }

    .mail-summary {
        line-height: 1.45;
    }

    .nav-button {
        font-size: 7px;
        padding: 6px 4px;
        box-sizing: border-box;
    }
}

@media (max-width: 430px) {
    .dashboard .card {
        height: 215px;
        padding: 10px;
    }

    .dashboard .card h2,
    .mail-header h2 {
        font-size: 13px;
    }

    #weeklyEvents p,
    #deadlineEvents p,
    #companyList p,
    .mail-item {
        font-size: 12px;
    }
}
</style>
</head>
<body>
{% include "_openai_credit_meter.html" %}

<header>
    <h1>就活管理ダッシュボード</h1>
    <div class="nav-buttons">
  <a href="/gd/new" class="nav-button">GD・面接ログを追加</a>
  <a href="/gd/logs" class="nav-button secondary">GD・面接ログ一覧</a>
  <a href="/self-profile" class="nav-button">自己分析管理</a>
  <a href="/company-research" class="nav-button company-nav-button">企業研究</a>
</div>
</header>

<main>
    <section class="dashboard">
        <div class="card">
            <h2>今日・今週の予定</h2>
            <div id="weeklyEvents"></div>
        </div>

        <div class="card">
            <h2>締切が近いES・適性検査</h2>
            <div id="deadlineEvents"></div>
        </div>

        <div class="card mail-card">
            <div class="mail-header">
                <h2>受信メール一覧</h2>
                <button id="showMailDetails" class="small-button">詳細を表示</button>
            </div>

            <div id="unhandledMails" class="mail-scroll-area">
                <p>読み込み中...</p>
            </div>
        </div>

        <div class="card">
            <h2>選考中企業一覧</h2>
            <div id="companyList"></div>
        </div>
    </section>

    <section class="calendar-section">
        <div class="calendar-header">
            <button id="prevMonth">＜</button>
            <h2 id="monthTitle"></h2>
            <button id="nextMonth">＞</button>
        </div>

        <div class="calendar-weekdays">
            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>
        </div>

        <div id="calendar" class="calendar"></div>
    </section>
</main>

<div id="modal" class="modal">
    <div class="modal-content">
        <button id="closeModal">×</button>
        <h2 id="modalTitle"></h2>
        <p id="modalDate"></p>
        <p id="modalSummary"></p>
    </div>
</div>

<script>
let events = [];
let currentDate = new Date();
let lastCalendarMobileState = window.matchMedia("(max-width: 700px)").matches;

fetch("/api/events")
    .then(response => response.json())
    .then(data => {
        events = data;
        renderCalendar();
        renderDashboard();
    });

function renderCalendar() {
    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");
    const isMobileCalendar = window.matchMedia("(max-width: 700px)").matches;

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

   monthTitle.textContent = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1);
    const startDay = firstDay.getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const totalCells = Math.ceil((startDay + lastDate) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement("div");
        cell.className = "calendar-cell";

        const dateNum = i - startDay + 1;

        if (dateNum > 0 && dateNum <= lastDate) {
            const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(dateNum).padStart(2, "0")}`;

            const dateLabel = document.createElement("div");
            dateLabel.className = "date-label";
            dateLabel.textContent = dateNum;
            cell.appendChild(dateLabel);

            const dayEvents = events.filter(e => e.date === dateStr);

            if (dayEvents.some(e => e.incomplete)) {
                cell.classList.add("incomplete-day");
            }

            if (isMobileCalendar) {
                if (dayEvents.length > 0) {
                    cell.classList.add("mobile-has-event");
                }
                if (dayEvents.some(e => e.incomplete)) {
                    cell.classList.add("mobile-incomplete-day");
                }
                cell.onclick = () => openDayModal(dateStr, dayEvents);
            } else {
                dayEvents.forEach(event => {
                    const eventDiv = document.createElement("div");
                    eventDiv.className = "event";
                    eventDiv.textContent = `${event.time} ${event.company}`;
                    eventDiv.onclick = () => openModal(event);
                    cell.appendChild(eventDiv);
                });
            }
        } else {
            cell.classList.add("empty");
        }

        calendar.appendChild(cell);
    }
}

function escapeHtml(text) {
    return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

fetch("/api/mails")
    .then(response => response.json())
    .then(mails => {
        const area = document.getElementById("unhandledMails");

        if (!mails || mails.length === 0) {
            area.innerHTML = "<p>受信メールなし</p>";
            return;
        }

        area.innerHTML = mails.map(mail => `
            <div class="mail-item">
                <p><strong>${escapeHtml(mail.received_at)}</strong>　${escapeHtml(mail.company || "企業名不明")}</p>
                <p class="mail-summary">${escapeHtml(mail.snippet || mail.subject)}</p>
            </div>
        `).join("");
    })
    .catch(error => {
        document.getElementById("unhandledMails").innerHTML =
            "<p>メールの読み込みに失敗しました。</p>";
        console.error(error);
    });

document.getElementById("showMailDetails").onclick = () => {
    window.open("/mail/details", "_blank");
};

function renderDashboard() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const oneWeekLater = new Date(today);
    oneWeekLater.setDate(today.getDate() + 7);

    const weekly = events.filter(e => {
        const d = new Date(e.date);
        d.setHours(0, 0, 0, 0);
        return d >= today && d <= oneWeekLater;
    });

    document.getElementById("weeklyEvents").innerHTML =
        weekly.map(e => `<p>${e.date} ${e.time} ${e.title}</p>`).join("") || "<p>予定なし</p>";

    const deadlines = events.filter(e => e.category === "ES締切");

    document.getElementById("deadlineEvents").innerHTML =
        deadlines.map(e => `<p>${e.date} ${e.time} ${e.company}</p>`).join("") || "<p>締切なし</p>";

    const companies = [...new Set(events.map(e => e.company))];

    document.getElementById("companyList").innerHTML =
        companies.map(c => `<p>${c}</p>`).join("") || "<p>企業なし</p>";
}

function openModal(event) {
    document.getElementById("modalTitle").textContent = event.title;
    document.getElementById("modalDate").textContent = `${event.date} ${event.time}`;
    document.getElementById("modalSummary").textContent = event.summary || "概要なし";
    document.getElementById("modal").style.display = "flex";
}

function openDayModal(dateStr, dayEvents) {
    document.getElementById("modalTitle").textContent = `${dateStr} の予定`;
    document.getElementById("modalDate").textContent = "";

    if (!dayEvents.length) {
        document.getElementById("modalSummary").innerHTML = "予定なし";
    } else {
        document.getElementById("modalSummary").innerHTML = dayEvents.map(event => {
            const marker = event.incomplete ? '<span class="day-event-incomplete">未提出</span> ' : "";
            return `<span class="day-event-row">${marker}${escapeHtml(event.time)} ${escapeHtml(event.title || event.company)}</span>`;
        }).join("");
    }

    document.getElementById("modal").style.display = "flex";
}

document.getElementById("closeModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

document.getElementById("prevMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
};

document.getElementById("nextMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
};

window.addEventListener("resize", () => {
    const nextCalendarMobileState = window.matchMedia("(max-width: 700px)").matches;
    if (nextCalendarMobileState !== lastCalendarMobileState) {
        lastCalendarMobileState = nextCalendarMobileState;
        renderCalendar();
    }
});
</script>

</body>
</html>
