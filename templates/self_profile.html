<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>自己分析管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-header">
    <h1>自己分析管理</h1>
</div>

<div class="fixed-nav">
    <a href="/">トップへ戻る</a>
</div>

<div class="form-page">
    <h2>新しく追加</h2>

    <form method="POST">
        <label>項目</label>
        <select name="category">
            {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
        </select>

        <label>タイトル</label>
        <input type="text" name="title" placeholder="例：学割サイト開発での統括経験">

        <label>内容</label>
        <textarea name="content" placeholder="具体的な経験・考え・強みなどを書いてください"></textarea>

        <button type="submit">追加する</button>
    </form>
</div>

<div class="profile-sections">
    {% for category in categories %}
    <section class="profile-section">
        <h2>{{ category }}</h2>

        <div class="profile-grid">
            {% for profile in profiles %}
                {% if profile.category == category %}
                <div class="profile-card">
                    <form class="delete-form" method="POST" action="/self-profile/delete/{{ profile.id }}" onsubmit="return confirm('この自己分析を削除しますか？');">
                        <button class="delete-icon-button" type="submit" aria-label="削除" title="削除">
                            <span aria-hidden="true">&#128465;</span>
                        </button>
                    </form>

                    <h3>{{ profile.title }}</h3>
                    <p class="profile-content" id="profile-content-{{ profile.id }}">{{ profile.content }}</p>
                    <small>{{ profile.created_at.strftime('%Y-%m-%d %H:%M') }}</small>

                    <button class="profile-detail-button" type="button" onclick="showProfileModal(this)">
                        詳細を見る
                    </button>
                </div>
                {% endif %}
            {% endfor %}
        </div>
    </section>
    {% endfor %}
</div>



<div id="profileModal" class="profile-modal" onclick="closeProfileModal()">
    <div class="profile-modal-content" onclick="event.stopPropagation()">
        <button class="profile-modal-close" type="button" onclick="closeProfileModal()" aria-label="閉じる">×</button>
        <h2 id="profileModalTitle"></h2>
        <small id="profileModalDate"></small>
        <p id="profileModalContent"></p>
    </div>
</div>

<script>
    function showProfileModal(button) {
        const card = button.closest(".profile-card");

        document.getElementById("profileModalTitle").innerText = card.querySelector("h3").innerText;
        document.getElementById("profileModalDate").innerText = card.querySelector("small").innerText;
        document.getElementById("profileModalContent").innerText = card.querySelector(".profile-content").innerText;
        document.getElementById("profileModal").style.display = "flex";
    }

    function closeProfileModal() {
        document.getElementById("profileModal").style.display = "none";
    }
</script>

</body>
</html>
